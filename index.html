<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinothèque – Wijnproefboek</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#501832">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vinothèque">
<link rel="apple-touch-icon" href="icon.svg">
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f1eb;color:#292329;font-family:Arial,sans-serif}
header{background:#501832;color:#fff;padding:16px 20px;position:sticky;top:0;z-index:5}
header>div,main{max-width:1050px;margin:auto}header>div{display:flex;justify-content:space-between;align-items:center}
h1,h2{font-family:Georgia,serif}h1{font-size:22px;margin:0}h2{color:#501832;margin-top:0}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:bold;cursor:pointer}
.primary{background:#c9a45c;color:#321521}.secondary{background:#eee3e8;color:#501832}
main{padding:22px 15px 60px}.hero{background:linear-gradient(135deg,#501832,#7b3151);color:#fff;padding:28px;border-radius:20px;margin-bottom:18px}
.hero h2{color:#fff;font-size:34px;margin:8px 0}.hero p{color:#f1e5ea}
.card{background:#fffdf9;border:1px solid #e3d9d2;border-radius:16px;padding:18px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.two{grid-template-columns:repeat(2,1fr)}
label{font-size:12px;font-weight:bold;color:#594e54}label span{display:block;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px;border:1px solid #d9cec7;border-radius:9px;background:white;font:inherit}textarea{min-height:80px}
.pills{display:flex;flex-wrap:wrap;gap:7px}.pill input{display:none}.pill span{display:block;padding:8px 10px;border:1px solid #d9cec7;border-radius:9px;font-weight:normal;cursor:pointer}.pill input:checked+span{background:#eee0e7;border-color:#8c5570;color:#501832}
#editor{display:none}.editing #dashboard{display:none}.editing #editor{display:block}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.item{border:1px solid #e3d9d2;background:#fff;border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:10px}.item h3{margin:0;color:#501832;font-family:Georgia,serif}.meta{font-size:12px;color:#776d72}.actions{display:flex;gap:6px;align-items:center}
.stars{font-size:22px;color:#c9a45c}.stars button{padding:0;background:none;color:#d8cec8;font-size:25px}.stars button.active{color:#c9a45c}
.notice{font-size:12px;color:#776d72}
@media(max-width:750px){.grid,.two,.list{grid-template-columns:1fr}.hero h2{font-size:28px}}
</style>
</head>
<body>
<header><div><h1>🍷 Vinothèque</h1><button class="primary" id="newWine">＋ Nieuwe wijn</button></div></header>

<main>
<section id="dashboard">
<div class="hero">
<div style="font-size:11px;letter-spacing:2px">WIJNPROEFBOEK</div>
<h2>Proef. Noteer. Herontdek.</h2>
<p>Een digitale versie van je degustatiefiche, met je eigen wijnarchief.</p>
<button class="primary" id="startWine">🍷 Start degustatie</button>
</div>
<div class="card">
<h2>Mijn degustaties</h2>
<input id="search" placeholder="🔎 Zoek op wijn, jaar, winkel...">
<div id="list" class="list" style="margin-top:12px"></div>
</div>
</section>

<section id="editor">
<form id="wineForm">
<div class="card">
<h2>🍾 De wijn</h2>
<div class="grid">
<label><span>Naam *</span><input id="name" required></label>
<label><span>Jaargang *</span><input id="year" type="number" required></label>
<label><span>Wanneer geproefd *</span><input id="tastedAt" type="datetime-local" required></label>
<label><span>Prijs (€)</span><input id="price" type="number" step="0.01"></label>
<label><span>Waar gekocht?</span><input id="boughtAt"></label>
<label><span>Groep / thema</span><input id="group"></label>
</div>
</div>

<div class="card"><h2>👁 Visueel</h2><div class="grid">
<label><span>Wijntype</span><select id="visualType"><option>stille wijn</option><option>mousserende wijn</option></select></label>
<label><span>Intensiteit</span><select id="visualIntensity"><option>laag</option><option>gemiddeld</option><option>hoog</option></select></label>
<label><span>Helderheid</span><select id="clarity"><option>helder</option><option>licht gesluierd</option><option>wazig</option><option>troebel</option></select></label>
<label><span>Schittering</span><select id="shine"><option>briljant</option><option>helder</option><option>mat</option></select></label>
<label><span>Kleur & nuance</span><input id="color"></label>
<label><span>Andere</span><input id="visualOther"></label>
</div></div>

<div class="card"><h2>👃 Olfactief</h2>
<div class="two grid">
<label><span>Zuiverheid</span><select id="olfPurity"><option>zuiver</option><option>onzuiver</option></select></label>
<label><span>Intensiteit</span><select id="olfIntensity"><option>laag</option><option>gemiddeld</option><option>hoog</option></select></label>
<label><span>Evolutie</span><select id="evolution"><option>minder intens</option><option>idem</option><option>meer intens</option></select></label>
<label><span>Aard aroma's</span><select id="aromaNature"><option>primair</option><option>secundair</option><option>tertiair</option></select></label>
</div>
<br><label><span>Concrete aroma's</span><textarea id="concreteAromas" placeholder="citroen, appel, perzik, vanille..."></textarea></label>
<br><label><span>Aromagroepen</span></label><div id="aromas" class="pills"></div>
</div>

<div class="card"><h2>👅 Gustatief</h2><div class="two grid">
<label><span>Zuiverheid</span><select id="tastePurity"><option>zuiver</option><option>onzuiver</option></select></label>
<label><span>Intensiteit</span><select id="tasteIntensity"><option>laag</option><option>gemiddeld</option><option>hoog</option></select></label>
<label><span>Eerste indruk</span><input id="firstImpression"></label>
<label><span>Retro-olfactie</span><input id="retro"></label>
<label><span>Zuren</span><select id="acidityAmount"><option>laag</option><option>gemiddeld</option><option>hoog</option></select></label>
<label><span>Rol zuren</span><select id="acidityRole"><option>vlak</option><option>ondersteunend</option><option>krokant</option><option>op de voorgrond</option><option>dominant</option></select></label>
<label><span>Zoetheid</span><select id="sweetness"><option>beendroog</option><option>droog</option><option>lichtzoet</option><option>zoet</option></select></label>
<label><span>Alcohol</span><select id="alcohol"><option>laag</option><option>gemiddeld</option><option>hoog</option></select></label>
<label><span>Tannine</span><select id="tanninAmount"><option>laag</option><option>gemiddeld</option><option>hoog</option></select></label>
<label><span>Aard tannine</span><select id="tanninNature"><option>onrijp</option><option>groen</option><option>korrelig</option><option>geïntegreerd</option><option>rijp</option><option>versmolten</option></select></label>
</div></div>

<div class="card"><h2>🌿 Afdronk</h2><div class="two grid">
<label><span>PAI — aroma</span><input id="paiAroma"></label><label><span>PAI — duur</span><select id="paiLength"><option>kort</option><option>middelmatig</option><option>lang</option><option>zeer lang</option></select></label>
<label><span>PG — structurele smaak</span><input id="pgTaste"></label><label><span>PG — duur</span><select id="pgLength"><option>kort</option><option>middelmatig</option><option>lang</option><option>zeer lang</option></select></label>
</div></div>

<div class="card"><h2>🏁 Conclusie</h2><div class="grid">
<label><span>Wijntype</span><select id="conclusionType"><option>stille wijn</option><option>mousserende wijn</option></select></label>
<label><span>Kleurtype</span><select id="colorType"><option>witte wijn</option><option>oranje wijn</option><option>rosé wijn</option><option>rode wijn</option></select></label>
<label><span>Wijnstijl</span><input id="wineStyle"></label>
<label><span>Klimaat</span><select id="climate"><option>cool climate</option><option>warm climate</option></select></label>
<label><span>Bewaarpotentieel</span><select id="ageing"><option>te jong</option><option>op dronk, maar kan nog rijpen</option><option>nu drinken, niet laten liggen</option><option>te oud</option></select></label>
<label><span>Temperatuur °C</span><input id="temperature" type="number" step=".5"></label>
<label><span>Vinificatie</span><select id="vinification"><option>reductief</option><option>oxidatief</option></select></label>
<label><span>Houtrijping</span><select id="wood"><option>neen</option><option>ja</option></select></label>
<label class="full"><span>Wijn & gerechten</span><textarea id="pairing"></textarea></label>
<label class="full"><span>Origine</span><input id="origin"></label>
<label class="full"><span>Persoonlijke waardering</span><div id="stars" class="stars"></div></label>
<label class="full"><span>Notities</span><textarea id="rating"></textarea></label>
</div>
<div class="toolbar" style="justify-content:flex-end;margin-top:18px"><button type="button" class="secondary" id="cancel">Annuleren</button><button class="primary" type="submit">✓ Bewaar degustatie</button></div>
</div>
</form>
</section>
</main>

<script>
(function(){
'use strict';
var KEY='vinotheque-simple-v3';
var aromaNames=['Floraal','Citrusfruit','Steenfruit','Rood fruit','Zwart fruit','Exotisch fruit','Gestoofd fruit','Gedroogd fruit','Vegetaal','Houtig','Kruidig','Mineraal','Gistachtig','Lactisch','Rokerig','Gebrand','Dierlijk','Chemisch','Confiserie'];
var fieldIds=['name','year','tastedAt','price','boughtAt','group','visualType','visualIntensity','clarity','shine','color','visualOther','olfPurity','olfIntensity','evolution','aromaNature','concreteAromas','tastePurity','tasteIntensity','firstImpression','retro','acidityAmount','acidityRole','sweetness','alcohol','tanninAmount','tanninNature','paiAroma','paiLength','pgTaste','pgLength','conclusionType','colorType','wineStyle','climate','ageing','temperature','vinification','wood','pairing','origin','rating'];
var score=0;

function el(id){return document.getElementById(id);}
function getWines(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
function saveWines(a){try{localStorage.setItem(KEY,JSON.stringify(a));}catch(e){} render();}
function now(){var d=new Date();function p(n){return String(n).padStart(2,'0');}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());}
function openEditor(){document.body.className='editing';el('tastedAt').value=now();window.scrollTo(0,0);}
function closeEditor(){document.body.className='';window.scrollTo(0,0);}
function clearForm(){el('wineForm').reset();el('wineForm').dataset.editing='';score=0;paintStars();document.querySelectorAll('#aromas input').forEach(function(x){x.checked=false;});openEditor();}
function paintStars(){var bs=el('stars').querySelectorAll('button');bs.forEach(function(b){b.className=(Number(b.dataset.n)<=score?'active':'');});}
function collect(){var o={};fieldIds.forEach(function(id){o[id]=el(id).value;});o.id=el('wineForm').dataset.editing||String(Date.now());o.score=score;o.aromas=[];document.querySelectorAll('#aromas input:checked').forEach(function(x){o.aromas.push(x.value);});return o;}
function fill(o){fieldIds.forEach(function(id){if(o[id]!==undefined)el(id).value=o[id];});score=o.score||0;paintStars();document.querySelectorAll('#aromas input').forEach(function(x){x.checked=(o.aromas||[]).indexOf(x.value)>=0;});el('wineForm').dataset.editing=o.id;openEditor();}
function render(){
var q=(el('search').value||'').toLowerCase();var a=getWines().filter(function(o){return JSON.stringify(o).toLowerCase().indexOf(q)>=0;}).sort(function(x,y){return (y.tastedAt||'').localeCompare(x.tastedAt||'');});
if(!a.length){el('list').innerHTML='<div class="notice">Nog geen degustaties. Tijd om een fles open te trekken. 🍷</div>';return;}
el('list').innerHTML=a.map(function(o){
var stars='★★★★★'.slice(0,o.score||0)+'☆☆☆☆☆'.slice(0,5-(o.score||0));
return '<div class="item"><div><h3>'+safe(o.name||'Naamloze wijn')+' <small>'+safe(o.year||'')+'</small></h3><div class="meta">'+safe(o.tastedAt||'')+(o.boughtAt?' · '+safe(o.boughtAt):'')+(o.price?' · € '+safe(o.price):'')+'</div><div class="stars" style="font-size:16px">'+stars+'</div></div><div class="actions"><button class="secondary" data-edit="'+safe(o.id)+'" type="button">Bewerk</button><button class="secondary" data-delete="'+safe(o.id)+'" type="button">×</button></div></div>';
}).join('');
}
function safe(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

aromaNames.forEach(function(a){var l=document.createElement('label');l.className='pill';l.innerHTML='<input type="checkbox" value="'+a+'"><span>'+a+'</span>';el('aromas').appendChild(l);});
for(var i=1;i<=5;i++){var b=document.createElement('button');b.type='button';b.dataset.n=i;b.textContent='★';b.addEventListener('click',function(){score=Number(this.dataset.n);paintStars();});el('stars').appendChild(b);}

el('newWine').addEventListener('click',clearForm);
el('startWine').addEventListener('click',clearForm);
el('cancel').addEventListener('click',closeEditor);
el('search').addEventListener('input',render);
el('list').addEventListener('click',function(e){
var b=e.target.closest('button');if(!b)return;
var id=b.getAttribute('data-edit')||b.getAttribute('data-delete');if(!id)return;
var a=getWines(),o=a.find(function(x){return x.id===id;});
if(b.hasAttribute('data-edit')){if(o)fill(o);}
else if(confirm('Deze degustatie verwijderen?')){saveWines(a.filter(function(x){return x.id!==id;}));}
});
el('wineForm').addEventListener('submit',function(e){
e.preventDefault();var o=collect(),a=getWines(),idx=a.findIndex(function(x){return x.id===o.id;});
if(idx<0)a.push(o);else a[idx]=o;saveWines(a);closeEditor();alert('Degustatie opgeslagen 🍷');
});
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
})();
</script>
</body>
</html>
